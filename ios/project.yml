name: Unignorable
options:
  bundleIdPrefix: dev.polyfeeds
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "99US464DK4"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Unignorable:
    type: application
    platform: iOS
    sources:
      - path: Unignorable/Sources
    settings:
      base:
        INFOPLIST_FILE: Unignorable/Sources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: dev.polyfeeds.unignorable
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_INTERFACE_ORIENTATIONS: UIInterfaceOrientationPortrait
  UnignorableTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UnignorableTests
    dependencies:
      - target: Unignorable
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.polyfeeds.unignorable.tests
  UnignorableUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UnignorableUITests
    dependencies:
      - target: Unignorable
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.polyfeeds.unignorable.ui-tests
schemes:
  Unignorable:
    build:
      targets:
        Unignorable: all
        UnignorableTests: [test]
        UnignorableUITests: [test]
    test:
      targets:
        - UnignorableTests
        - UnignorableUITests
    run:
      config: Debug
